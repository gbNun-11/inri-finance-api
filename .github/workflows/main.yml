name: Deploy

# on: [push]
on:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "24"
            - name: ESLint
              run: npm run eslint:check
            - name: Prettier
              run: npm run prettier:check